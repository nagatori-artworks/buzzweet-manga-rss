name: Update Buzzweet manga RSS

on:
  schedule:
    # About every 2 hours; times are UTC, and execution is best-effort.
    - cron: '23 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: buzzweet-manga-rss
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Fetch Buzzweet and generate RSS
        run: python generate.py
      - name: Save RSS and history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update manga RSS [skip ci]'
            git push
          else
            echo 'RSS history unchanged'
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload RSS files
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
